name: Build & Release

# Push a tag like v1.0.0 to build the Android APK + macOS app, publish a GitHub Release,
# and update the Homebrew formula. "Run workflow" (manual) only builds, for testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so the APK is signed with a temporary debug key. Updates won't install over it. See docs/PUBLISHING.md."
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk "LiteBrowser-${{ steps.v.outputs.name }}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: LiteBrowser-*.apk

  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: make build VERSION=${{ steps.v.outputs.name }}

      - name: Zip
        run: ditto -c -k --keepParent build/LiteBrowser.app "LiteBrowser-${{ steps.v.outputs.name }}-macOS.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: LiteBrowser-*-macOS.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            **Mac** (Terminal):
            ```
            brew install ${{ github.repository_owner }}/tap/lite-browser
            ```

            **Android:** download the `.apk` below on your phone and open it. If asked, allow your browser to "install unknown apps".

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_GITHUB_TOKEN is not set, so the Homebrew formula was not updated. See docs/PUBLISHING.md."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA=$(curl -sfL "$URL" | sha256sum | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s#YOUR_GITHUB_USER/lite-browser#${GITHUB_REPOSITORY}#g" \
              -e "s#^  url .*#  url \"${URL}\"#" \
              -e "s#^  version .*#  version \"${VERSION}\"#" \
              -e "s#^  sha256 .*#  sha256 \"${SHA}\"#" \
              Formula/lite-browser.rb > tap/Formula/lite-browser.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lite-browser.rb
          git diff --cached --quiet || git commit -m "lite-browser ${VERSION}"
          git push
