<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New Tab</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f8fa; --surface:#ffffff; --ink:#111827; --ink2:#374151; --muted:#6b7280; --faint:#9ca3af;
  --line:#e5e7eb; --chip:#eef0f3; --chip-hover:#e4e7ec; --accent:#2563eb; --ring:rgba(37,99,235,.18);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 4px 12px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1b1e; --surface:#24262b; --ink:#f3f4f6; --ink2:#d1d5db; --muted:#9ca3af; --faint:#6b7280;
  --line:#33363d; --chip:#2b2e34; --chip-hover:#34373e; --accent:#60a5fa; --ring:rgba(96,165,250,.22);
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 6px 16px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;min-height:100vh;-webkit-user-select:none;user-select:none;
}
main{width:min(680px,100% - 40px);padding-top:clamp(56px,14vh,140px);flex:1}

/* Brand */
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:28px}
.brand img{width:44px;height:44px;border-radius:11px}
.brand h1{margin:0;font-size:30px;font-weight:650;letter-spacing:-.02em}
.brand h1 span{color:var(--accent)}

/* Search */
form{margin:0}
.search{
  display:flex;align-items:center;gap:12px;height:52px;padding:0 18px;border-radius:26px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s;
}
.search:hover{box-shadow:var(--shadow-lg)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--faint)}
.kbd{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px}

/* Sections */
section{margin-top:40px}
.head{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px}
.head h2{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.link{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--accent);cursor:pointer}
.link:hover{text-decoration:underline}

/* Shortcuts */
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sc{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;border-radius:12px;text-decoration:none;color:var(--ink2);transition:background .12s}
.sc:hover{background:var(--chip)}
.sc .ic{width:52px;height:52px;border-radius:50%;background:var(--chip);display:grid;place-items:center;overflow:hidden;transition:background .12s}
.sc:hover .ic{background:var(--surface);box-shadow:var(--shadow)}
.sc .ic img{width:26px;height:26px}
.sc .ic.letter{color:#fff;font-weight:600;font-size:20px}
.sc .nm{font-size:12.5px;max-width:100%;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .x{position:absolute;top:4px;right:10px;width:20px;height:20px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);box-shadow:var(--shadow);font-size:12px;line-height:20px;cursor:pointer;opacity:0;transition:opacity .12s}
.sc:hover .x{opacity:1}
.sc .x:hover{color:#dc2626}

/* Recently visited */
.recent{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;text-decoration:none;color:inherit;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--chip)}
.row .fav{width:20px;height:20px;flex:none;border-radius:5px;display:grid;place-items:center;overflow:hidden}
.row .fav img{width:18px;height:18px}
.row .fav.letter{color:#fff;font-size:11px;font-weight:700}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-size:12px;color:var(--faint);flex:none}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}

/* Footer */
footer{width:min(680px,100% - 40px);padding:40px 0 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
footer nav{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px}
footer nav button{background:none;border:0;padding:4px 0;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
footer nav button:hover{color:var(--ink)}
footer .meta{font-size:12px;color:var(--faint);text-align:center}

/* Phones */
@media (max-width:560px){
  main{width:calc(100% - 28px);padding-top:28px}
  .brand{margin-bottom:20px}
  .brand img{width:36px;height:36px;border-radius:9px}
  .brand h1{font-size:24px}
  .search{height:50px}
  .kbd{display:none}
  section{margin-top:30px}
  .shortcuts{gap:2px}
  .sc{padding:10px 2px}
  .sc .ic{width:50px;height:50px}
  .sc .nm{font-size:12px}
  .sc .x{display:none}
  .row{padding:12px 14px}
  .row .when{display:none}
  footer{width:calc(100% - 28px);padding:30px 0 18px}
  footer nav{gap:2px 16px}
}
@media (hover:none){ .sc .x{display:none} .sc:hover{background:none} .sc:hover .ic{background:var(--chip);box-shadow:none} }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="AppIcon.png" alt=""><h1>Lite<span>Browser</span></h1></div>

  <form id="form" autocomplete="off">
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search Google or type a URL" spellcheck="false" autocomplete="off" enterkeyhint="go">
      <span class="kbd">/</span>
    </label>
  </form>

  <section>
    <div class="head"><h2 id="scTitle">Shortcuts</h2><button class="link" id="restore" hidden>Restore removed</button></div>
    <div class="shortcuts" id="shortcuts"></div>
  </section>

  <section id="recentSection" hidden>
    <div class="head"><h2>Recently visited</h2><button class="link" data-settings="history">See all history</button></div>
    <div class="recent" id="recent"></div>
  </section>
</main>

<footer>
  <nav>
    <button data-settings="history">History</button>
    <button data-settings="downloads">Downloads</button>
    <button data-settings="privacy">Clear browsing data</button>
    <button data-settings="dns">DNS</button>
  </nav>
  <div class="meta"><span id="ver">LiteBrowser</span> · Your history stays on this device</div>
</footer>

<script>
const $ = s => document.querySelector(s);
const post = msg => {
  try {
    if (window.LiteAndroid) window.LiteAndroid.post(JSON.stringify(msg));          // Android app
    else window.webkit.messageHandlers.home.postMessage(msg);                      // Mac app
  } catch (e) {}
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---- Search (same rules as the address bar)
function toURL(text) {
  const t = text.trim();
  if (!t) return null;
  if (/^(https?|file):\/\//i.test(t)) return t;
  if (!/\s/.test(t) && (/\.[a-z]{2,}(\/|:|$)/i.test(t) || /^localhost(:\d+)?/.test(t))) {
    return (/^(localhost|127\.|192\.168\.)/.test(t) ? 'http://' : 'https://') + t;
  }
  return 'https://www.google.com/search?q=' + encodeURIComponent(t);
}
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const url = toURL($('#q').value);
  if (url) location.href = url;
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
});

// ---- Names, icons
const FRIENDLY = {
  'google.com': 'Google', 'youtube.com': 'YouTube', 'mail.google.com': 'Gmail', 'github.com': 'GitHub',
  'wikipedia.org': 'Wikipedia', 'en.wikipedia.org': 'Wikipedia', 'x.com': 'X', 'twitter.com': 'X', 'facebook.com': 'Facebook',
  'instagram.com': 'Instagram', 'linkedin.com': 'LinkedIn', 'web.whatsapp.com': 'WhatsApp', 'chatgpt.com': 'ChatGPT',
  'claude.ai': 'Claude', 'maps.google.com': 'Maps', 'drive.google.com': 'Drive', 'netflix.com': 'Netflix',
  'reddit.com': 'Reddit', 'stackoverflow.com': 'Stack Overflow', 'amazon.com': 'Amazon', 'daraz.pk': 'Daraz',
  'news.ycombinator.com': 'Hacker News', 'docs.google.com': 'Docs',
};
const DEFAULTS = [
  { host: 'google.com', url: 'https://www.google.com/' },
  { host: 'youtube.com', url: 'https://www.youtube.com/' },
  { host: 'mail.google.com', url: 'https://mail.google.com/' },
  { host: 'github.com', url: 'https://github.com/' },
  { host: 'en.wikipedia.org', url: 'https://en.wikipedia.org/' },
  { host: 'maps.google.com', url: 'https://maps.google.com/' },
  { host: 'web.whatsapp.com', url: 'https://web.whatsapp.com/' },
  { host: 'drive.google.com', url: 'https://drive.google.com/' },
];
const COLORS = ['#4f46e5', '#0891b2', '#059669', '#d97706', '#dc2626', '#7c3aed', '#db2777', '#0d9488'];
const colorFor = h => COLORS[[...h].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];

function friendly(host) {
  host = host.replace(/^(www|m|mobile)\./, '');
  if (FRIENDLY[host]) return FRIENDLY[host];
  const parts = host.split('.');
  const core = parts.length > 2 && parts[parts.length - 2].length <= 3 ? parts[parts.length - 3] : parts[parts.length - 2] || host;
  return core.charAt(0).toUpperCase() + core.slice(1);
}
const favicon = (host, size) => `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=${size}`;

function fallback(img) {
  const box = img.parentElement;
  box.classList.add('letter');
  box.style.background = box.dataset.color;
  box.textContent = box.dataset.letter;
}

function shortcutHTML(s, removable) {
  const name = friendly(s.host);
  return `<a class="sc" href="${esc(s.url)}" title="${esc(s.title || name)}" data-host="${esc(s.host)}" ${removable ? 'data-removable="1"' : ''}>
      <div class="ic" data-letter="${esc(name.charAt(0))}" data-color="${colorFor(s.host)}"><img src="${favicon(s.host, 64)}" alt="" onerror="fallback(this)"></div>
      <div class="nm">${esc(name)}</div>
      ${removable ? `<button class="x" title="Remove" data-remove="${esc(s.host)}">✕</button>` : ''}
    </a>`;
}

function ago(ms) {
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return 'Just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' h ago';
  const d = Math.round(h / 24);
  return d === 1 ? 'Yesterday' : d + ' days ago';
}

function recentHTML(r) {
  const host = r.host.replace(/^www\./, '');
  return `<a class="row" href="${esc(r.url)}">
      <div class="fav" data-letter="${esc(friendly(host).charAt(0))}" data-color="${colorFor(host)}"><img src="${favicon(host, 32)}" alt="" onerror="fallback(this)"></div>
      <div class="t"><b>${esc(r.title || friendly(host))}</b><small>${esc(host)}</small></div>
      <div class="when">${ago(r.time)}</div>
    </a>`;
}

// ---- Render (called by the app with your top sites and recent pages)
function renderHome(state) {
  if (state.version) $('#ver').textContent = 'LiteBrowser ' + state.version;
  const real = (state.sites || []).slice(0, 8);
  const seen = new Set(real.map(s => s.host));
  const fill = real.length < 8
    ? DEFAULTS.filter(d => !seen.has(d.host) && !(state.hidden || []).includes(d.host)).slice(0, 8 - real.length)
    : [];
  $('#shortcuts').innerHTML = real.map(s => shortcutHTML(s, true)).join('') + fill.map(s => shortcutHTML(s, false)).join('');
  $('#restore').hidden = !(state.hidden && state.hidden.length);

  const recent = (state.recent || []).slice(0, 5);
  $('#recentSection').hidden = recent.length === 0;
  $('#recent').innerHTML = recent.map(recentHTML).join('');
}

// Long-press (phones) or right-click (Mac) a shortcut to remove it
document.addEventListener('contextmenu', e => {
  const sc = e.target.closest('.sc');
  if (!sc || !sc.dataset.removable) return;
  e.preventDefault();
  if (confirm(`Remove ${friendly(sc.dataset.host)} from shortcuts?`)) post({ action: 'remove', host: sc.dataset.host });
});

document.addEventListener('click', e => {
  const rm = e.target.closest('[data-remove]');
  if (rm) { e.preventDefault(); e.stopPropagation(); post({ action: 'remove', host: rm.dataset.remove }); return; }
  const st = e.target.closest('[data-settings]');
  if (st) { post({ action: 'settings', tab: st.dataset.settings }); return; }
  if (e.target.id === 'restore') post({ action: 'restore' });
});

renderHome({ sites: [], hidden: [] });
post({ action: 'ready' });
</script>
</body>
</html>
